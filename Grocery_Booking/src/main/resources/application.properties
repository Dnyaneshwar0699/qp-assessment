spring.application.name=Grocery_Booking

server.port=8070

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/grocerybooking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=AdminPass@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

request.mapping.url.prefix = grocery/api/v1/

logging.file.name= log/track_my_class.log
spring.cloud.config.enabled=false
